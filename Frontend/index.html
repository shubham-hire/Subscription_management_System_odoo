<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brightloop Subscription Management System — manage products, plans, subscriptions, invoices, and payments." />
    <title>Brightloop — Subscription Management</title>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <script>
    window.__errs = [];
    window.addEventListener('error', function (e) {
      window.__errs.push(String((e.error && e.error.stack) || e.message).slice(0, 600));
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__errs.push('REJ: ' + String(e.reason && e.reason.stack ? e.reason.stack : e.reason).slice(0, 600));
    });
  </script>
  <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
